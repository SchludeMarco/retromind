<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>RetroMind – Guests only</title>
  <link rel="stylesheet" href="/legal.css">
  <style>
    main { max-width: 480px; text-align: center; padding-top: 12vh; }
    .logo { width: 220px; max-width: 70%; height: auto; margin-bottom: 16px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px; margin: 20px 0 8px;
      padding: 12px 22px; border: 2px solid var(--fg); border-radius: 10px;
      background: var(--bg); color: var(--fg); font: inherit; font-weight: 700; cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .msg { min-height: 3em; }
    .msg.error { color: #b91c1c; }
    @media (prefers-color-scheme: dark) { .msg.error { color: #fca5a5; } }
    footer { margin-top: 40px; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <img class="logo" src="/retromind-logo-header.webp" alt="RetroMind">
  <h1 id="title">Guests only</h1>
  <p id="intro" class="muted"></p>
  <button id="signin" class="btn" type="button">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    <span id="signin-label">Sign in with Google</span>
  </button>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>
  <footer class="muted">
    <a id="privacy" href="/privacy.html">Privacy policy</a> · <a id="imprint" href="/imprint.html">Legal notice</a>
  </footer>
</main>
<script>
  // The door of RetroMind for invited guests (middleware.js sends everyone
  // without the guest cookie here). Google's sign-in script only loads when
  // the button is tapped; the server checks the address against Marco's
  // guest list (api/admin.js, action guestLogin) and sets the cookie. The same
  // sign-in also counts as the Google sign-in inside the apps (Drive backup,
  // profile): it asks for the same permissions as lib/googleAuth.ts and leaves
  // the session where lib/googleLogin.ts looks for it.
  (function () {
    var lang = null;
    try { lang = localStorage.getItem('retromind.lang'); } catch (e) {}
    var de = lang ? lang === 'de' : /^de\b/i.test(navigator.language || '');
    var t = function (en, deText) { return de ? deText : en; };
    document.documentElement.lang = de ? 'de' : 'en';
    document.title = t('RetroMind – Guests only', 'RetroMind – Nur für Gäste');
    document.getElementById('title').textContent = t('Guests only', 'Nur für Gäste');
    document.getElementById('intro').textContent = t(
      'RetroMind is a private project for invited friends and family. Sign in with the Google account Marco invited.',
      'RetroMind ist ein privates Projekt für eingeladene Freunde und Familie. Melde dich mit dem Google-Konto an, das Marco eingeladen hat.'
    );
    document.getElementById('signin-label').textContent = t('Sign in with Google', 'Mit Google anmelden');
    var privacy = document.getElementById('privacy');
    var imprint = document.getElementById('imprint');
    privacy.textContent = t('Privacy policy', 'Datenschutzerklärung');
    privacy.href = de ? '/datenschutz.html' : '/privacy.html';
    imprint.textContent = t('Legal notice', 'Impressum');
    imprint.href = de ? '/impressum.html' : '/imprint.html';

    var params = new URLSearchParams(location.search);
    var target = params.get('next') || '/';
    if (!/^\/(?!\/)/.test(target) || target.indexOf('/gate.html') === 0) target = '/';

    var btn = document.getElementById('signin');
    var msg = document.getElementById('msg');
    var say = function (text, error) { msg.textContent = text; msg.className = error ? 'msg error' : 'msg'; };
    var clientId = null;

    fetch('/api/admin?view=gate', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { clientId = d.clientId; })
      .catch(function () {});

    var loadGoogle = function () {
      return new Promise(function (resolve, reject) {
        if (window.google && google.accounts && google.accounts.oauth2) return resolve();
        var s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.onload = function () { resolve(); };
        s.onerror = reject;
        document.head.appendChild(s);
      });
    };

    // Same keys and permissions as lib/googleLogin.ts and lib/googleAuth.ts.
    var SCOPES = 'openid email profile https://www.googleapis.com/auth/drive.appdata ' +
      'https://www.googleapis.com/auth/user.birthday.read https://www.googleapis.com/auth/user.gender.read';
    var optedIn = false;
    try { optedIn = localStorage.getItem('retromind.google') === '1'; } catch (e) {}

    var keepSession = function (resp) {
      return fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { Authorization: 'Bearer ' + resp.access_token }
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d) return;
          var session = {
            token: { accessToken: resp.access_token, expiresAt: Date.now() + (Number(resp.expires_in) || 3600) * 1000 },
            user: { id: d.sub, name: d.name || d.email, email: d.email, picture: d.picture || '' }
          };
          try {
            localStorage.setItem('retromind.google', '1');
            localStorage.setItem('retromind.google.session', JSON.stringify(session));
          } catch (e) {}
        })
        .catch(function () {});
    };

    var done = function (resp) {
      var token = resp.access_token;
      say(t('Checking the guest list …', 'Gästeliste wird geprüft …'));
      fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'guestLogin', token: token })
      })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
        .then(function (res) {
          btn.disabled = false;
          if (res.status === 200) {
            say(t('Welcome! Opening RetroMind …', 'Willkommen! RetroMind öffnet sich …'));
            keepSession(resp).then(function () { location.replace(target); });
          } else if (res.data.error === 'not_invited') {
            say(t(
              res.data.email + ' is not on the guest list yet. Ask Marco for an invitation.',
              res.data.email + ' steht noch nicht auf der Gästeliste. Frag Marco nach einer Einladung.'
            ), true);
          } else {
            say(t('That didn’t work. Please try again.', 'Das hat nicht geklappt. Bitte versuch es noch einmal.'), true);
          }
        })
        .catch(function () {
          btn.disabled = false;
          say(t('No connection. Please try again.', 'Keine Verbindung. Bitte versuch es noch einmal.'), true);
        });
    };

    var tokenClient = null;
    var prepare = function () {
      if (!clientId) return Promise.reject(new Error('no client'));
      return loadGoogle().then(function () {
        if (tokenClient) return;
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: SCOPES,
          callback: function (resp) {
            if (resp && resp.access_token) done(resp);
            else { btn.disabled = false; say(t('Sign-in was cancelled.', 'Anmeldung abgebrochen.'), true); }
          },
          error_callback: function () { btn.disabled = false; say(t('Sign-in was cancelled.', 'Anmeldung abgebrochen.'), true); }
        });
      });
    };
    // Google's script loads as soon as a finger or mouse reaches the button,
    // so the sign-in window can open right in the tap (browsers block
    // pop-ups that open later).
    ['pointerenter', 'pointerdown', 'focus', 'touchstart'].forEach(function (ev) {
      btn.addEventListener(ev, function () { prepare().catch(function () {}); }, { passive: true });
    });

    btn.addEventListener('click', function () {
      if (!clientId) return say(t('Sign-in isn’t ready yet. Please try again in a moment.', 'Die Anmeldung ist noch nicht bereit. Bitte gleich noch einmal versuchen.'), true);
      if (tokenClient) {
        btn.disabled = true;
        say('');
        tokenClient.requestAccessToken({ prompt: optedIn ? '' : 'consent' });
        return;
      }
      btn.disabled = true;
      say(t('Loading Google sign-in …', 'Google-Anmeldung wird geladen …'));
      prepare()
        .then(function () {
          btn.disabled = false;
          say(t('Ready. Please tap the button once more.', 'Bereit. Bitte tippe noch einmal auf den Knopf.'));
        })
        .catch(function () {
          btn.disabled = false;
          say(t('Google sign-in could not be loaded.', 'Die Google-Anmeldung konnte nicht geladen werden.'), true);
        });
    });
  })();
</script>
</body>
</html>
